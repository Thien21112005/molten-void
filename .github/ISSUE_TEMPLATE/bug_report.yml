name: Bug Report
description: Create a report to help us improve Molten Void
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report an issue!
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      description: What browser and operating system were you using?
      placeholder: e.g. Chrome 124 on Windows 11 / Safari on iOS 17
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what went wrong.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this behavior?
      placeholder: |
        1. Open the game
        2. Drag slingshot towards...
        3. See error
    validations:
      required: true
